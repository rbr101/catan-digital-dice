; Generic ESP32-WROOM-32 dev board (AZ-Delivery DevKit V4), wired up freehand on a
; breadboard rather than the purpose-built enclosure PCB used by the other two envs.
; TFT_SCLK/MOSI/DC/RST/DISPLAY_BL_PIN below match the working esphome st7789v config
; for this same panel (clk_pin/mosi_pin/dc_pin/reset_pin/backlight_pin); TFT_CS has no
; equivalent there (that config has no cs_pin - the panel's CS is tied low on the
; breakout board) so it's set to a spare, unconnected pin only because TFT_eSPI
; requires one to be defined. DISPLAY_GND_PIN/DISPLAY_VCC_PIN are likewise spare/unused:
; that esphome config powers the panel straight from 3V3/GND rather than switching it
; through GPIOs, so these two only matter if you rewire the panel's power through them.
; Change any of these with -D<NAME>=<gpio> if your wiring differs.
[env:esp32dev]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200 ; lower/safer upload baud rate - this board's USB-serial link drops out at the default 460800
lib_deps =
	adafruit/Adafruit GFX Library@^1.12.0
	bodmer/TFT_eSPI@^2.5.43
	bxparks/AceButton@^1.10.1
build_flags =
	-Os
	-DUSER_SETUP_LOADED=1
	; 1.3" 240x240 ST7789 SPI display
	-DST7789_DRIVER=1
	-DTFT_RGB_ORDER=TFT_RGB	; some ST7789 1.3" panels need TFT_BGR instead if colors look swapped
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DTFT_INVERSION_ON=1	; most 1.3" ST7789 modules need this or colors render inverted; remove if colors look wrong
	-DTFT_SCLK=14   ; matches esphome clk_pin
	-DTFT_MOSI=4    ; matches esphome mosi_pin
	-DTFT_RST=13    ; matches esphome reset_pin
	-DTFT_DC=16     ; matches esphome dc_pin
	-DTFT_CS=27     ; unconnected - this panel's CS is tied low on the breakout board
	-DDISPLAY_BL_PIN=12 ; matches esphome backlight_pin
	-DDISPLAY_GND_PIN=18 ; unused unless you rewire the panel's GND through a GPIO
	-DDISPLAY_VCC_PIN=19 ; unused unless you rewire the panel's VCC through a GPIO
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=20000000
	-DBUTTON_PIN=32     ; Pin for the main button
	-DBUTTON_LED_PIN=33 ; Pin for the main button led
	-DMENU_PIN=25       ; Pin for the menu button
	-DMENU_LED_PIN=26   ; Pin for the menu button led
	-DBATTERY_PIN=34    ; Pin for the battery voltage divider (input-only ADC1 pin)
	-DBUTTON_ACTIVE_HIGH=1 ; 3-pin button modules (+/GND/IO) usually idle LOW and go HIGH when pressed
	-DBUTTON_DEBUG=1 ; temporary: prints raw button pin levels over serial, see loop() - remove once buttons are confirmed working
	-DDISABLE_ALL_LIBRARY_WARNINGS=1
